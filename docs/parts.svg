<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="title">
  <title id="title">Apps send prompts straight to OpenRouter. The omni-tokens server only makes keys, reads spend, and charges or refunds on the escrow.</title>
  <!-- Icons: Lucide (lucide.dev), ISC License, see docs/lucide-LICENSE.txt -->
  <style>
    .bg{fill:#f3f3f4;stroke:#e4e4e6}.paper{fill:#fff;stroke:#e4e4e6}
    .ink{fill:#2c2c2c}.mute{fill:#8a8a8d}.acc{fill:#1e61f5}.white{fill:#fff}
    .ci{color:#2c2c2c}.cw{color:#fff}
    .inkS{stroke:#2c2c2c;fill:none}.muteS{stroke:#8a8a8d;fill:none}
    .t{font-family:Figtree,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
    @media (prefers-color-scheme:dark){
      .bg{fill:#111113;stroke:#2c2c30}.paper{fill:#1b1b1e;stroke:#2c2c30}
      .ink{fill:#ececee}.acc{fill:#3d74ff}.ci{color:#ececee}.inkS{stroke:#ececee}
    }
  </style>
  <defs>
    <symbol id="app" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/><path d="M6 4v4"/></symbol>
    <symbol id="route" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.5"/><path d="m10.2 6.3-3.9 3.9"/><circle cx="4.5" cy="12" r="2.5"/><path d="M7 12h10"/><circle cx="19.5" cy="12" r="2.5"/><path d="m13.8 17.7 3.9-3.9"/><circle cx="12" cy="19.5" r="2.5"/></symbol>
    <symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></symbol>
    <symbol id="wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mute"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="879" height="329" rx="10"/>

  <g class="t" font-size="15" font-weight="700">
    <rect class="paper" x="40.5" y="34.5" width="170" height="52" rx="6"/><use href="#app" x="60" y="50" width="20" height="20" class="ci"/><text x="92" y="65" class="ink">Your app</text>
    <rect class="paper" x="670.5" y="34.5" width="170" height="52" rx="6"/><use href="#route" x="690" y="50" width="20" height="20" class="ci"/><text x="722" y="65" class="ink">OpenRouter</text>
    <rect class="acc" x="355" y="139" width="171" height="53" rx="6"/><use href="#server" x="373" y="155" width="20" height="20" class="cw"/><text x="405" y="170" class="white">omni-tokens</text>
    <rect class="paper" x="40.5" y="244.5" width="170" height="52" rx="6"/><use href="#wallet" x="60" y="260" width="20" height="20" class="ci"/><text x="92" y="275" class="ink">Your wallet</text>
    <rect class="paper" x="670.5" y="244.5" width="170" height="52" rx="6"/><use href="#lock" x="690" y="260" width="20" height="20" class="ci"/><text x="722" y="275" class="ink">Escrow</text>
  </g>

  <path class="inkS" stroke-width="3" marker-end="url(#b)" d="M211 60.5h452"/>
  <text x="440" y="50" class="t m ink" font-size="11" font-weight="700" text-anchor="middle">PROMPTS GO STRAIGHT HERE</text>

  <g class="muteS" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)">
    <path d="M211 270.5h452"/>
    <path d="M125 244V165.5H350"/>
    <path d="M526 155.5H740V93"/>
    <path d="M526 175.5H780V238"/>
  </g>
  <g class="t m mute" font-size="10" font-weight="600" text-anchor="middle">
    <text x="440" y="290">LOCK · CLOSE</text>
    <text x="238" y="157">SIGN</text>
    <text x="633" y="147">MAKE KEY · READ SPEND</text>
    <text x="653" y="194">CHARGE · REFUND</text>
  </g>
</svg>
