<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title">
  <title id="title">Lock tokens in the escrow, sign to get an OpenRouter key, use it in any app. Closing returns the unused tokens; the used part is burned or sent to a treasury.</title>
  <!-- Icons: Lucide (lucide.dev), ISC License, see docs/lucide-LICENSE.txt -->
  <style>
    .bg{fill:#f3f3f4;stroke:#e4e4e6}.paper{fill:#fff;stroke:#e4e4e6}
    .ink{fill:#2c2c2c}.mute{fill:#8a8a8d}.acc{fill:#1e61f5}.good{fill:#1b9e57}.white{fill:#fff}
    .ci{color:#2c2c2c}.cw{color:#fff}.cr{color:#d11a2a}
    .inkS{stroke:#2c2c2c;fill:none}.muteS{stroke:#8a8a8d;fill:none}.goodS{stroke:#1b9e57;fill:none}
    .t{font-family:Figtree,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
    @media (prefers-color-scheme:dark){
      .bg{fill:#111113;stroke:#2c2c30}.paper{fill:#1b1b1e;stroke:#2c2c30}
      .ink{fill:#ececee}.acc{fill:#3d74ff}.good{fill:#34c27a}
      .ci{color:#ececee}.cr{color:#ff5a64}.inkS{stroke:#ececee}.goodS{stroke:#34c27a}
    }
  </style>
  <defs>
    <symbol id="wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
    <symbol id="flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mute"/></marker>
    <marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="good"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="879" height="299" rx="10"/>

  <g class="t" text-anchor="middle">
    <rect class="paper" x="30.5" y="36.5" width="160" height="124" rx="6"/>
    <text x="44" y="57" class="m mute" font-size="11" text-anchor="start">01</text>
    <use href="#wallet" x="94" y="66" width="32" height="32" class="ci"/>
    <text x="110" y="128" class="ink" font-size="15" font-weight="700">Your wallet</text>
    <text x="110" y="147" class="mute" font-size="13">any ERC-20</text>

    <rect class="paper" x="250.5" y="36.5" width="160" height="124" rx="6"/>
    <text x="264" y="57" class="m mute" font-size="11" text-anchor="start">02</text>
    <use href="#lock" x="314" y="66" width="32" height="32" class="ci"/>
    <text x="330" y="128" class="ink" font-size="15" font-weight="700">Escrow</text>
    <text x="330" y="147" class="mute" font-size="13">holds the lock</text>

    <rect class="acc" x="470" y="36" width="161" height="125" rx="6"/>
    <text x="484" y="57" class="m white" font-size="11" text-anchor="start" opacity=".7">03</text>
    <use href="#key" x="534" y="66" width="32" height="32" class="cw"/>
    <text x="550" y="128" class="white" font-size="15" font-weight="700">OpenRouter key</text>
    <text x="550" y="147" class="white" font-size="13" opacity=".8">capped in dollars</text>

    <rect class="paper" x="690.5" y="36.5" width="160" height="124" rx="6"/>
    <text x="704" y="57" class="m mute" font-size="11" text-anchor="start">04</text>
    <use href="#grid" x="754" y="66" width="32" height="32" class="ci"/>
    <text x="770" y="128" class="ink" font-size="15" font-weight="700">Any app</text>
    <text x="770" y="147" class="mute" font-size="13">Cursor · Cline · SDKs</text>
  </g>

  <g class="muteS" stroke-width="1.5" marker-end="url(#a)"><path d="M194 98h50"/><path d="M414 98h50"/><path d="M634 98h50"/></g>
  <g class="t m mute" font-size="10" font-weight="600" text-anchor="middle"><text x="220" y="89">LOCK</text><text x="440" y="89">SIGN</text><text x="660" y="89">USE</text></g>

  <text x="330" y="185" class="t m mute" font-size="10" font-weight="600" text-anchor="middle">CLOSE</text>
  <path class="goodS" stroke-width="2" stroke-linejoin="round" marker-end="url(#g)" d="M300 161V230H110V168"/>
  <text x="205" y="252" class="t m good" font-size="11" font-weight="700" text-anchor="middle">UNUSED → BACK TO YOU</text>
  <path class="inkS" stroke-width="2" stroke-linejoin="round" marker-end="url(#i)" d="M360 161V248H464"/>
  <rect class="paper" x="470.5" y="220.5" width="250" height="56" rx="6"/>
  <use href="#flame" x="484" y="236" width="24" height="24" class="cr"/>
  <text x="520" y="244" class="t ink" font-size="14" font-weight="700">used part</text>
  <text x="520" y="263" class="t mute" font-size="13">burned, or to a treasury</text>
</svg>
