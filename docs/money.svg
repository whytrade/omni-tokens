<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-labelledby="title">
  <title id="title">A 12 USDC lock buys a $10.91 key. Using $4.00 charges 4.40 USDC; the other 7.60 USDC comes back.</title>
  <style>
    .bg{fill:#f3f3f4;stroke:#e4e4e6}.track{fill:#e4e4e6}
    .ink{fill:#2c2c2c}.mute{fill:#8a8a8d}.acc{fill:#1e61f5}.good{fill:#1b9e57}.muteS{stroke:#8a8a8d}
    .t{font-family:Figtree,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
    @media (prefers-color-scheme:dark){
      .bg{fill:#111113;stroke:#2c2c30}.track{fill:#2c2c30}
      .ink{fill:#ececee}.acc{fill:#3d74ff}.good{fill:#34c27a}
    }
  </style>
  <defs>
    <clipPath id="k"><rect x="150" y="46" width="690" height="18" rx="4"/></clipPath>
    <clipPath id="l"><rect x="150" y="124" width="690" height="18" rx="4"/></clipPath>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="879" height="199" rx="10"/>
  <g class="t">
    <text x="40" y="60" class="m mute" font-size="11" font-weight="600">KEY</text>
    <g clip-path="url(#k)"><rect class="track" x="150" y="46" width="690" height="18"/><rect class="acc" x="150" y="46" width="253" height="18"/></g>
    <text x="150" y="36" class="ink" font-size="14" font-weight="700">$4.00 used</text>
    <text x="840" y="36" class="mute" font-size="13" text-anchor="end">$10.91 limit</text>

    <path class="muteS" stroke-width="1" stroke-dasharray="3 3" d="M403.5 64v60"/>
    <text x="412" y="98" class="m mute" font-size="10" font-weight="600">SAME SHARE</text>

    <text x="40" y="138" class="m mute" font-size="11" font-weight="600">LOCK</text>
    <text x="40" y="155" class="mute" font-size="12">12 USDC</text>
    <g clip-path="url(#l)"><rect class="good" x="150" y="124" width="690" height="18"/><rect class="acc" x="150" y="124" width="253" height="18"/></g>
    <text x="150" y="164" class="acc" font-size="14" font-weight="700">4.40 charged</text>
    <text x="840" y="164" class="good" font-size="14" font-weight="700" text-anchor="end">7.60 back to you</text>
    <text x="840" y="188" class="mute" font-size="11" text-anchor="end">example: $1 token, 10% markup</text>
  </g>
</svg>
